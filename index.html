                    <div className={`absolute top-1/2 -right-1.5 w-2 h-4 bg-slate-200 border-[2px] border-indigo-400 rounded-full z-0 origin-top ${getArmRAnim()}`}></div>
                </div>
            );
        };

        // =========================================================================
        // 9. APLICACIÓN PRINCIPAL
        // =========================================================================
        function App() {
            const [view, setView] = useState('home');
            const [exIdx, setExIdx] = useState(0);
            const [step, setStep] = useState(0);
            const [isMuted, setIsMuted] = useState(false);
            const scrollContainerRef = useRef(null);

            const curEx = EXERCISES[exIdx];
            const maxSteps = curEx.steps.length - 1;
            const curStepData = curEx.steps[step];
            const EnunciadoText = curEx.enunciado;

            const handleInteraction = () => {
                AudioController.init();
                AudioController.startBGM();
            };

            const startExercise = (index) => {
                handleInteraction();
                AudioController.play('swoosh');
                setExIdx(index);
                setStep(0);
                setView('lab');
            };

            const nextStep = () => {
                handleInteraction();
                if (step < maxSteps) {
                    const next = step + 1;
                    setStep(next);
                    AudioController.play(next === maxSteps ? 'success' : 'pop');
                } else {
                    AudioController.play('swoosh');
                    if (exIdx < EXERCISES.length - 1) {
                        setExIdx(exIdx + 1);
                        setStep(0);
                    } else {
                        setView('home');
                    }
                }
            };

            const prevStep = () => {
                handleInteraction();
                if (step > 0) {
                    setStep(step - 1);
                    AudioController.play('pop-reverse');
                }
            };

            const toggleMute = () => {
                handleInteraction();
                setIsMuted(AudioController.toggleMute());
            };

            useEffect(() => {
                if (scrollContainerRef.current) {
                    scrollContainerRef.current.scrollTop = scrollContainerRef.current.scrollHeight;
                }
            }, [step, exIdx, view]);

            // ------------------------- PORTADA (2 BLOQUES, 12 EJERCICIOS) -------------------------
            if (view === 'home') {
                const block1 = EXERCISES.filter(e => e.block === 1);
                const block2 = EXERCISES.filter(e => e.block === 2);

                const renderCard = (ex) => {
                    const idx = EXERCISES.findIndex(item => item.id === ex.id);
                    return (
                        <button
                            key={ex.id}
                            onClick={() => startExercise(idx)}
                            className="group text-left p-4 rounded-[1.5rem] bg-white/10 backdrop-blur-xl border-[3px] border-white/35 hover:border-yellow-300 hover:-translate-y-1.5 hover:shadow-[0_16px_30px_rgba(0,0,0,0.38)] transition-all flex flex-col relative overflow-hidden shadow-lg min-h-[10.2rem]"
                        >
                            <div className={`absolute inset-0 bg-gradient-to-br ${ex.cardGradient} opacity-85 group-hover:opacity-100 transition-opacity`}></div>
                            <div className="relative z-10 flex-1 flex flex-col">
                                <div className="flex items-center justify-between mb-2">
                                    <span className={`${ex.badgeColor} text-white text-xs font-black px-3 py-0.5 rounded-full uppercase tracking-wider shadow-sm`}>
                                        {ex.title}
                                    </span>
                                    <span className="text-white/95 text-xs font-extrabold bg-black/25 px-2.5 py-0.5 rounded-full">
                                        3D • {ex.steps.length} pasos
                                    </span>
                                </div>
                                <div className="flex-1 my-1.5 bg-white/95 rounded-xl px-2.5 py-2 text-slate-900 shadow-inner flex items-center justify-center border border-white/60 pointer-events-none math-card">
                                    <MathDisplay latex={ex.previewLatex} align="center" />
                                </div>
                                <div className="text-white text-sm sm:text-base font-black text-center mt-1.5 drop-shadow-md">
                                    {ex.subtitle}
                                </div>
                            </div>
                        </button>
                    );
                };

                return (
                    <div className="w-screen h-[100dvh] bg-gradient-to-br from-[#0f172a] via-[#312e81] to-[#831843] flex flex-col items-center justify-start p-4 sm:p-6 relative font-fun overflow-y-auto scrollbar-hide">
                        <FloatingBackground />

                        {/* Barra superior */}
                        <div className="w-[96%] max-w-[1400px] z-20 flex items-center justify-between mb-5 mt-1">
                            <div className="inline-flex items-center gap-2 px-4 py-2 rounded-2xl border-2 border-yellow-300 bg-white/15 backdrop-blur-md text-yellow-300 font-black tracking-wider uppercase shadow-md text-xs sm:text-base">
                                <Rocket className="w-5 h-5 text-yellow-300" /> TuProfe20 Lab
                            </div>
                            <button onClick={toggleMute} title="Audio" className="p-2.5 sm:p-3 rounded-2xl bg-white/20 border-2 border-white/30 backdrop-blur-md text-white hover:bg-white/30 transition-all active:scale-95">
                                {isMuted ? <VolumeX className="w-5 h-5 sm:w-6 sm:h-6" /> : <Volume2 className="w-5 h-5 sm:w-6 sm:h-6" />}
                            </button>
                        </div>

                        {/* Encabezado de portada */}
                        <div className="relative z-10 text-center w-[96%] max-w-[1400px] flex flex-col items-center pb-12">
                            <div className="inline-flex items-center gap-2 px-4 py-1 rounded-full bg-white/15 border border-white/30 text-cyan-200 font-black text-xs sm:text-sm uppercase tracking-widest mb-3 shadow-sm">
                                Geometría del Espacio • 1.° de Secundaria
                            </div>
                            <h1 className="text-3xl sm:text-5xl md:text-6xl font-black text-white mb-3 drop-shadow-[0_5px_0_rgba(0,0,0,0.3)] tracking-tight leading-tight uppercase">
                                ÁREA Y VOLÚMENES DE <span className="text-yellow-300 underline decoration-wavy decoration-cyan-400 underline-offset-8">SÓLIDOS GEOMÉTRICOS</span>
                            </h1>
                            <p className="text-sm sm:text-lg lg:text-xl text-purple-100 mb-8 font-bold max-w-3xl leading-relaxed">
                                Explora 12 ejercicios con sólidos 3D interactivos que puedes rotar en tiempo real paso a paso 🧊✨🤖
                            </p>

                            {/* BLOQUE 1 */}
                            <div className="w-full mb-8">
                                <div className="flex items-center gap-3 mb-4">
                                    <span className="px-4 py-1.5 rounded-full bg-cyan-400 text-slate-950 font-black text-xs sm:text-sm uppercase tracking-widest shadow-md">
                                        Bloque 1 • Poliedros y Prismas (Ejercicios 1 al 6)
                                    </span>
                                    <div className="flex-1 h-[2px] bg-white/25 rounded-full"></div>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {block1.map(renderCard)}
                                </div>
                            </div>

                            {/* BLOQUE 2 */}
                            <div className="w-full">
                                <div className="flex items-center gap-3 mb-4">
                                    <span className="px-4 py-1.5 rounded-full bg-yellow-400 text-slate-950 font-black text-xs sm:text-sm uppercase tracking-widest shadow-md">
                                        Bloque 2 • Áreas y Volúmenes (Ejercicios 7 al 12)
                                    </span>
                                    <div className="flex-1 h-[2px] bg-white/25 rounded-full"></div>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {block2.map(renderCard)}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // ------------------------- VISTA LABORATORIO -------------------------
            return (
                <div className="lab-root w-screen h-[100dvh] bg-gradient-to-br from-[#0f172a] via-[#312e81] to-[#831843] text-slate-800 flex flex-col p-2 sm:p-3.5 relative font-fun overflow-hidden">
                    <FloatingBackground />
                    {step === maxSteps && <Confetti />}

                    {/* Barra superior */}
                    <div className="shrink-0 relative z-10 w-[98%] max-w-[1440px] mx-auto flex justify-between items-center mb-2.5 px-1 gap-2">
                        <div className="flex items-center gap-2">
                            <button
                                onClick={() => { AudioController.play('swoosh'); setView('home'); }}
                                className="flex items-center justify-center px-3.5 py-2 rounded-[1rem] bg-white/10 border-[2.5px] border-white/30 backdrop-blur-md text-white font-black hover:bg-white/20 transition-all shadow-lg active:scale-95 text-xs sm:text-sm"
                            >
                                <Home className="w-4 h-4 sm:w-5 sm:h-5 sm:mr-1.5" />
                                <span className="hidden sm:inline">Portada</span>
                            </button>
                            <div className="hidden xl:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/10 border border-yellow-300/40 text-yellow-300 font-black text-xs uppercase tracking-wider">
                                <Rocket className="w-4 h-4" /> TuProfe20 Lab
                            </div>
                        </div>

                        {/* Selector numérico 1 al 12 */}
                        <div className="flex items-center gap-1 sm:gap-1.5 bg-black/35 p-1.5 rounded-[1rem] border-2 border-white/20 backdrop-blur-md shadow-lg overflow-x-auto scrollbar-hide max-w-[66vw]">
                            {EXERCISES.map((ex, i) => (
                                <button
                                    key={ex.id}
                                    onClick={() => startExercise(i)}
                                    className={`shrink-0 w-7 h-7 sm:w-9 sm:h-9 rounded-[0.7rem] font-black text-xs sm:text-sm transition-all ${
                                        exIdx === i
                                            ? 'bg-yellow-400 text-slate-900 scale-110 shadow-[0_0_12px_rgba(250,204,21,0.75)]'
                                            : 'text-white hover:bg-white/20'
                                    }`}
                                >
                                    {ex.id}
                                </button>
                            ))}
                        </div>

                        <button onClick={toggleMute} title="Audio" className="p-2 sm:p-2.5 rounded-[1rem] bg-white/10 border-[2.5px] border-white/30 text-white hover:bg-white/20 transition-all shadow-lg active:scale-95">
                            {isMuted ? <VolumeX className="w-5 h-5" /> : <Volume2 className="w-5 h-5" />}
                        </button>
                    </div>

                    {/* Pizarra principal */}
                    <div className="lab-board flex-1 min-h-0 relative z-10 w-[98%] max-w-[1440px] mx-auto bg-white rounded-[1.8rem] sm:rounded-[2.2rem] border-[5px] sm:border-[7px] border-slate-100 shadow-[0_25px_55px_rgba(0,0,0,0.5)] flex flex-col overflow-hidden">

                        {/* Encabezado oscuro con enunciado */}
                        <div className="lab-enun shrink-0 bg-slate-900 border-b-[4px] border-cyan-500 px-4 py-2.5 sm:px-6 sm:py-3 flex flex-col justify-center relative shadow-md z-20">
                            <div className="flex justify-between items-center w-full max-w-6xl mx-auto mb-1">
                                <span className="bg-cyan-400 text-slate-950 font-black text-xs sm:text-sm px-3 py-0.5 rounded-md uppercase tracking-widest shadow-sm">
                                    {curEx.title}
                                </span>
                                <span className="text-yellow-300 font-extrabold text-xs sm:text-sm bg-white/10 px-3 py-0.5 rounded-md">
                                    {curEx.subtitle}
                                </span>
                            </div>
                            <div className="text-white font-bold text-sm sm:text-lg md:text-xl text-center w-full max-w-5xl mx-auto leading-snug math-enunciado">
                                <EnunciadoText />
                            </div>
                        </div>

                        {/* Área dividida: 46% desarrollo fluido / 54% gráfico 3D de gran tamaño */}
                        <div className="lab-split flex-1 flex flex-col md:flex-row bg-slate-50 overflow-hidden relative">

                            {/* PANEL IZQUIERDO: DESARROLLO PASO A PASO SIN RECUADROS */}
                            <div
                                ref={scrollContainerRef}
                                className="w-full md:w-[46%] flex-1 px-5 py-4 sm:px-7 sm:py-5 overflow-y-auto scrollbar-hide flex flex-col gap-3 pb-16 relative z-10 border-b-2 md:border-b-0 md:border-r-2 border-slate-200/70"
                            >
                                <div className="absolute inset-0 opacity-[0.04] bg-[radial-gradient(#0f172a_1.5px,transparent_1.5px)] [background-size:20px_20px] pointer-events-none"></div>

                                <div className="relative z-10 flex items-center justify-between border-b border-slate-200 pb-1.5">
                                    <span className="text-xs font-black uppercase tracking-widest text-indigo-600">
                                        Desarrollo Paso a Paso
                                    </span>
                                    <span className="text-xs font-extrabold text-slate-400">
                                        Geometría 1.° Sec.
                                    </span>
                                </div>

                                {curEx.steps.slice(0, step + 1).map((s, idx) => {
                                    const isCurrent = idx === step;
                                    const isFinal = isCurrent && step === maxSteps;
                                    return (
                                        <div
                                            key={`${exIdx}-${idx}`}
                                            className={`relative z-10 pl-3.5 py-1 transition-all duration-300 border-l-[4px] ${
                                                isFinal
                                                    ? 'border-l-amber-400 animate-finalGlow rounded-r-xl pr-3 opacity-100 animate-slideInRight'
                                                    : isCurrent
                                                        ? 'border-l-cyan-500 opacity-100 animate-slideInRight'
                                                        : 'border-l-slate-300 opacity-55'
                                            }`}
                                        >
                                            <div className="mb-0.5 flex items-center gap-2">
                                                <span
                                                    className={`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full font-black text-[11px] sm:text-xs tracking-wide ${
                                                        isFinal
                                                            ? 'bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 shadow-sm'
                                                            : isCurrent
                                                                ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-sm'
                                                                : 'bg-slate-200 text-slate-600'
                                                    }`}
                                                >
                                                    {isCurrent && <Sparkles className="w-3.5 h-3.5" />}
                                                    {s.badge}
                                                </span>
                                            </div>
                                            <div className={`py-0.5 ${isFinal ? 'math-final' : isCurrent ? 'math-current' : 'math-history'}`}>
                                                <MathDisplay latex={s.latex} align="left" />
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* PANEL DERECHO: SÓLIDO 3D INTERACTIVO DE GRAN TAMAÑO */}
                            <div className="w-full md:w-[54%] flex-1 bg-white/90 p-3 sm:p-4 flex flex-col relative z-10 min-h-[260px]">
                                <div className="flex items-center gap-1.5 mb-2 z-20">
                                    <BoxIcon className="w-4 h-4 text-cyan-500" />
                                    <span className="font-black text-slate-500 uppercase tracking-widest text-[11px] sm:text-xs">
                                        Modelo 3D Interactivo
                                    </span>
                                </div>
                                <div className="flex-1 w-full min-h-0">
                                    <ThreeScene3D
                                        exerciseId={curEx.id}
                                        step={step}
                                        hudCaption={curStepData.hud}
                                    />
                                </div>
                            </div>

                            {/* Pizarra superpuesta */}
                            <DrawingCanvas />
                        </div>

                        {/* Barra del Robot Asistente */}
                        <div className="lab-robot shrink-0 bg-white w-full px-4 py-2 sm:px-6 sm:py-2.5 flex items-center gap-3 sm:gap-5 border-t-[3px] border-slate-100 z-30 relative shadow-[0_-8px_18px_rgba(0,0,0,0.04)]">
                            <div className="shrink-0 absolute -top-9 sm:relative sm:top-0 left-3 sm:left-0 drop-shadow-xl z-50">
                                <RobotAssistant step={step} maxSteps={maxSteps} />
                            </div>
                            <div className="flex-1 text-xs sm:text-sm md:text-base font-bold text-slate-700 leading-snug bg-blue-50/90 px-3 py-2 sm:px-4 sm:py-2.5 rounded-[1rem] border-2 border-blue-100 min-h-[2.8rem] flex items-center shadow-sm ml-[3.4rem] sm:ml-0">
                                <div key={`speech-${exIdx}-${step}`} className="animate-slideInRight w-full">
                                    {curStepData.robotSpeech}
                                </div>
                            </div>
                        </div>

                        {/* Controles inferiores */}
                        <div className="lab-controls shrink-0 bg-gradient-to-b from-[#e0e7ff] to-[#c7d2fe] p-2 sm:p-2.5 w-full flex flex-col items-center border-t-[3px] border-white z-40">
                            <div className="flex justify-center items-stretch w-full max-w-4xl gap-2 sm:gap-3 h-9 sm:h-10">
                                <button
                                    onClick={prevStep}
                                    disabled={step === 0}
                                    className="flex-[0.8] bg-[#a5b4fc] border-b-[4px] border-[#6366f1] text-[#312e81] rounded-l-xl font-black text-xs sm:text-sm flex items-center justify-center gap-1 active:border-b-0 active:translate-y-[4px] disabled:opacity-40 transition-all hover:bg-[#c7d2fe]"
                                >
                                    <ChevronLeft className="w-4 h-4 sm:w-5 sm:h-5 stroke-[3px]" />
                                    <span className="hidden sm:inline">Atrás</span>
                                </button>
                                <div className="bg-[#6366f1] text-white font-black px-3 sm:px-5 text-xs sm:text-sm flex items-center justify-center border-b-[4px] border-[#4338ca] shadow-inner whitespace-nowrap min-w-[4.5rem]">
                                    Paso {step + 1}/{maxSteps + 1}
                                </div>
                                <button
                                    onClick={nextStep}
                                    className={`flex-[2] border-b-[4px] text-white rounded-r-xl font-black text-xs sm:text-sm flex items-center justify-center gap-1 active:border-b-0 active:translate-y-[4px] transition-all shadow-sm hover:brightness-110 ${
                                        step === maxSteps
                                            ? 'bg-gradient-to-r from-[#10b981] to-[#047857] border-[#065f46] animate-pulse'
                                            : 'bg-gradient-to-r from-[#06b6d4] to-[#0284c7] border-[#0369a1]'
                                    }`}
                                >
                                    <span>
                                        {step < maxSteps
                                            ? '¡Siguiente Paso!'
                                            : exIdx < EXERCISES.length - 1
                                                ? `Siguiente Ejercicio (${EXERCISES[exIdx + 1].id})`
                                                : '¡Volver a Portada!'}
                                    </span>
                                    <ChevronRight className="w-4 h-4 sm:w-5 sm:h-5 stroke-[3px]" />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
